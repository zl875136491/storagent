# 独立测试组件。不加入旧的 storagent-test compose 项目。
services:
  mongo:
    image: mongo:6.0
    container_name: storagent-vs-mongo
    network_mode: host
    command: ["--replSet", "vsrs", "--bind_ip", "10.32.12.110", "--port", "27018", "--auth", "--keyFile", "/etc/mongo.key"]
    volumes:
      - /opt/storagent-vs/data/mongo:/data/db
      - /opt/storagent-vs/mongo.key:/etc/mongo.key:ro
    restart: unless-stopped

  minio:
    image: bitnami/minio:latest
    container_name: storagent-vs-minio
    environment:
      MINIO_ROOT_USER: ${VS_MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${VS_MINIO_SECRET_KEY}
    volumes:
      - /opt/storagent-vs/data/minio:/bitnami/minio/data
    ports:
      - "127.0.0.1:19020:9000"
    restart: unless-stopped

  api:
    image: storagent-virtual-storage-nuc:dev
    container_name: storagent-vs-api-a
    network_mode: host
    env_file:
      - /opt/storagent-vs/env/api.env
    volumes:
      - /opt/storagent-vs/certs:/certs:ro
    depends_on:
      - mongo
      - minio
    restart: unless-stopped

  worker:
    image: storagent-virtual-storage-nuc:dev
    container_name: storagent-vs-worker-a
    network_mode: host
    env_file:
      - /opt/storagent-vs/env/worker.env
    command: ["python", "-m", "src.virtual_storage.workers"]
    healthcheck:
      disable: true
    depends_on:
      - mongo
      - minio
    restart: unless-stopped
